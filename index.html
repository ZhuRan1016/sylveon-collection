<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5abc8">
<title>仙子伊布日版收藏图鉴</title>
<style>
:root{--pink:#f5abc8;--pink-soft:#fff0f6;--blue:#8fd0ec;--ink:#352c38;--muted:#786d79;--line:#eadde5;--bg:#fff8fb;--ok:#3ca66a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:linear-gradient(180deg,#fff7fb,#f5fbff);color:var(--ink)}
button,input,select{font:inherit}
header{position:sticky;top:0;z-index:20;padding:14px;background:rgba(255,248,251,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:auto}
h1{font-size:22px;margin:0} .sub{margin:4px 0;color:var(--muted);font-size:13px}
.summary{margin-top:12px;background:white;border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 8px 24px rgba(74,45,66,.07)}
.summary-top{display:flex;justify-content:space-between;align-items:end}
#summaryCount{font-size:22px;font-weight:800} #summaryPercent{font-size:22px;font-weight:800}
.progress{height:10px;background:#eee4ea;border-radius:999px;overflow:hidden;margin-top:8px} .progress div{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--blue))}
main{max-width:1120px;margin:auto;padding:14px}
.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}
.controls input,.controls select{border:1px solid var(--line);background:white;border-radius:13px;padding:11px;color:var(--ink)}
.filters{display:flex;gap:8px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px} .tab{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;white-space:nowrap} .tab.active{background:var(--pink-soft);border-color:var(--pink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px} .stat{background:white;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center} .stat b{display:block} .stat span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:13px}
.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(76,45,68,.07);position:relative;cursor:pointer} .card.owned{outline:3px solid rgba(60,166,106,.45)}
.visual{aspect-ratio:2.5/3.5;background:linear-gradient(145deg,#ffe2ed,#dff4ff);display:grid;place-items:center;position:relative;overflow:hidden}
.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.placeholder{text-align:center;font-weight:800;color:#8f7182} .placeholder small{display:block;margin-top:7px}
.badge{position:absolute;top:9px;left:9px;padding:5px 8px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;font-size:11px;z-index:2}
.stock-badge{position:absolute;top:9px;right:9px;width:42px;height:42px;border-radius:50%;border:2px solid white;background:rgba(53,44,56,.82);color:white;font-weight:800;z-index:3}
.card.owned .stock-badge{background:var(--ok)}
.body{padding:11px} .name{font-size:14px;font-weight:800} .number{font-size:13px;font-weight:700;margin-top:5px} .meta{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px} .stock-text{margin-top:7px;font-size:12px;font-weight:700;color:var(--ok)} .stock-text.zero{color:var(--muted)}
.modal{position:fixed;inset:0;z-index:999;background:rgba(38,26,37,.52);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.panel{position:relative;width:min(620px,96vw);max-height:94vh;overflow:auto;background:white;border-radius:24px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.close{position:absolute;top:12px;right:12px;z-index:10000;width:46px;height:46px;border-radius:50%;border:1px solid rgba(0,0,0,.08);background:white;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:28px;line-height:1;display:grid;place-items:center;cursor:pointer}
.stage{perspective:1200px;display:grid;place-items:center;padding:8px 0 14px}
.float-card{position:relative;width:min(380px,78vw);aspect-ratio:2.5/3.5;transform-style:preserve-3d;transition:transform .2s ease;filter:drop-shadow(0 26px 32px rgba(57,35,53,.32));border-radius:18px}
.float-card.active{transition:none}
.float-card img{width:100%;height:100%;object-fit:contain;border-radius:18px;display:block}
.glare{position:absolute;inset:0;border-radius:18px;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.45),rgba(255,255,255,.08) 22%,transparent 48%);mix-blend-mode:screen;opacity:.75}
.detail-title{margin:4px 0} .detail-number{font-weight:800}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px} dt{color:var(--muted)} dd{margin:0}
.inventory{margin-top:16px;border:1px solid var(--line);background:#fff8fb;border-radius:16px;padding:14px}
.inventory-label{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.inventory-controls{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:12px}
.stock-btn{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:white;font-size:28px} #modalStock{text-align:center;font-size:34px;font-weight:800}
footer{text-align:center;padding:30px 15px 50px;color:var(--muted);font-size:12px}
@media(max-width:720px){.controls{grid-template-columns:1fr}.filters{display:grid;grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.modal{padding:0;align-items:end}.panel{width:100%;max-height:97vh;border-radius:24px 24px 0 0}.float-card{width:min(360px,82vw)}}
</style>
</head>

<header><div class="wrap">
<h1>🎀 仙子伊布日版收藏图鉴</h1><div class="sub">SYLDB V3.3 · 单文件稳定版</div>
<div class="summary"><div class="summary-top"><div id="summaryCount">0 / 0</div><div id="summaryPercent">0%</div></div><div class="progress"><div id="bar"></div></div></div>

<div id="modal" class="modal" hidden>
<div class="panel" id="panel">
<button id="closeBtn" class="close" type="button" aria-label="关闭">×</button>

<footer>库存记录保存在当前浏览器。换设备前请导出备份。</footer>

const STOCK_KEY='syldb-stock-v3';
const stock=JSON.parse(localStorage.getItem(STOCK_KEY)||'{}');
let activeEra='全部',selected=null;
const $=s=>document.querySelector(s),qty=id=>Math.max(0,Number(stock[id]||0)),owned=c=>qty(c.id)>0,save=()=>localStorage.setItem(STOCK_KEY,JSON.stringify(stock));
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function init(){const rs=[...new Set(CARDS.map(c=>c.rarity).filter(Boolean))].sort();$('#rarity').innerHTML='<option value="all">全部稀有度</option>'+rs.map(r=>`<option>${esc(r)}</option>`).join('');bind();render()}
function filtered(){const q=$('#search').value.trim().toLowerCase(),st=$('#status').value,ra=$('#rarity').value;return CARDS.filter(c=>{const h=`${c.name_ja} ${c.card_number} ${c.set_name} ${c.variant} ${c.rarity}`.toLowerCase();return(!q||h.includes(q))&&(activeEra==='全部'||c.era===activeEra)&&(st==='all'||(st==='owned'&&owned(c))||(st==='missing'&&!owned(c)))&&(ra==='all'||c.rarity===ra)})}
function render(){const eras=['全部',...new Set(CARDS.map(c=>c.era))];$('#tabs').innerHTML=eras.map(e=>`<button class="tab ${e===activeEra?'active':''}" data-e="${e}">${e}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeEra=b.dataset.e;render()});$('#stats').innerHTML=[...new Set(CARDS.map(c=>c.era))].map(e=>{const g=CARDS.filter(c=>c.era===e);return`<div class="stat"><b>${e} ${g.filter(owned).length}/${g.length}</b><span>库存 ${g.reduce((s,c)=>s+qty(c.id),0)} 张</span></div>`}).join('');const arr=filtered();$('#grid').innerHTML=arr.map(c=>`<article class="card ${owned(c)?'owned':''}" data-id="${c.id}"><div class="visual">${c.image_url?`<img loading="lazy" src="${esc(c.image_url)}" onload="this.nextElementSibling.hidden=true" onerror="this.remove()">`:''}<div class="placeholder">🎀<small>${esc(c.card_number)}</small></div><span class="badge">${esc(c.era)}</span><button class="stock-badge" data-plus="${c.id}">${qty(c.id)}</button></div><div class="body"><div class="name">${esc(c.name_ja)}</div><div class="number">${esc(c.card_number)}</div><div class="meta">${esc(c.set_name)}<br>${esc(c.rarity||'—')} · ${esc(c.variant||'普通版')}</div><div class="stock-text ${qty(c.id)===0?'zero':''}">库存：${qty(c.id)} 张</div></div></article>`).join('');document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=e=>{e.stopPropagation();change(b.dataset.plus,1)});document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openCard(c.dataset.id));const kinds=CARDS.filter(owned).length,total=CARDS.length,all=CARDS.reduce((s,c)=>s+qty(c.id),0),p=total?Math.round(kinds/total*100):0;$('#summaryCount').textContent=`${kinds} / ${total} · 库存 ${all} 张`;$('#summaryPercent').textContent=p+'%';$('#bar').style.width=p+'%'}
function change(id,d){stock[id]=Math.max(0,qty(id)+d);if(!stock[id])delete stock[id];save();render();if(selected&&selected.id===id)$('#modalStock').textContent=qty(id)}
function openCard(id){selected=CARDS.find(c=>c.id===id);$('#modalImg').src=selected.image_url;$('#modalName').textContent=selected.name_ja;$('#modalNumber').textContent=selected.card_number;$('#meta').innerHTML=[['时代',selected.era],['系列',selected.set_name],['稀有度',selected.rarity||'—'],['版本',selected.variant||'普通版'],['数据库ID',selected.id]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');$('#modalStock').textContent=qty(id);$('#modal').hidden=false;requestAnimationFrame(bindTilt)}
function closeModal(e){if(e){e.preventDefault();e.stopPropagation()}$('#modal').hidden=true;selected=null}
function bindTilt(){const c=$('#floatCard');const reset=()=>{c.classList.remove('active');c.style.transform='rotateX(0) rotateY(0) translateZ(0)';c.style.setProperty('--gx','50%');c.style.setProperty('--gy','50%')};const move=(x,y)=>{const r=c.getBoundingClientRect(),px=Math.max(0,Math.min(1,(x-r.left)/r.width)),py=Math.max(0,Math.min(1,(y-r.top)/r.height));c.classList.add('active');c.style.transform=`rotateX(${(.5-py)*18}deg) rotateY(${(px-.5)*18}deg) translateZ(20px) scale(1.015)`;c.style.setProperty('--gx',px*100+'%');c.style.setProperty('--gy',py*100+'%')};c.onmousemove=e=>move(e.clientX,e.clientY);c.onmouseleave=reset;c.ontouchmove=e=>e.touches[0]&&move(e.touches[0].clientX,e.touches[0].clientY);c.ontouchend=reset}
function bind(){$('#search').oninput=render;$('#status').onchange=render;$('#rarity').onchange=render;$('#plus').onclick=()=>change(selected.id,1);$('#minus').onclick=()=>change(selected.id,-1);$('#closeBtn').addEventListener('click',closeModal,true);$('#closeBtn').addEventListener('touchend',closeModal,true);$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal(e)};$('#panel').onclick=e=>e.stopPropagation()}
init();
</script>
